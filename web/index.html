<title>팝 셰퍼드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
  /* 밤 목장 한 가지 화면: 캔버스가 화면 전체, 메뉴는 그 위에 뜨는 나무 팻말 */
  :root {
    color-scheme: dark;
    --night: #0e1f1a;
    --grass: #16302a;
    --plank: #2b2118;
    --plank-edge: #c99a5b;
    --cream: #f4efe1;
    --mute: #b9cbbf;
    --gold: #ffcf5a;
    --sky: #9fe3ff;
    --display: "Jua", "Gowun Dodum", system-ui, sans-serif;
    --body: "Gowun Dodum", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  /* hidden 속성이 아래 display 규칙에 지지 않게 (파일로 바로 열 때 빈 오버레이가 화면을 덮던 문제) */
  [hidden] { display: none !important; }
  body { background: var(--night); color: var(--cream); font-family: var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #game { width: 100%; height: 100%; display: block; touch-action: none; }

  /* 메뉴가 떠 있으면 문서가 스크롤된다 (오버레이 안쪽 스크롤 상자를 쓰지 않음: 폰에서 다시 그릴 때 맨 위로 튀던 문제) */
  body.menu { overflow-y: auto; }
  #overlay {
    position: absolute; top: 0; left: 0; right: 0; box-sizing: border-box; min-height: 100%; display: grid; place-items: center;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(8, 17, 14, 0.62);
  }
  .panel {
    width: min(100%, 980px); box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;
    background: var(--plank); border: 3px solid var(--plank-edge); border-radius: 14px;
    padding: clamp(18px, 3vw, 34px); box-shadow: 0 18px 50px rgba(0,0,0,0.45);
  }
  .panel.title { width: min(100%, 620px); text-align: center; align-items: center; }
  .eyebrow { margin: 0; font-family: var(--display); color: var(--gold); letter-spacing: 0.08em; font-size: 15px; }
  h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 400; text-wrap: balance; }
  h1 { font-size: clamp(36px, 6vw, 64px); line-height: 1.05; }
  h1.logo { font-size: clamp(48px, 9vw, 92px); color: var(--cream); text-shadow: 0 4px 0 #6d4a26; }
  h2 { font-size: clamp(26px, 4vw, 38px); }
  h3 { font-size: 22px; color: var(--gold); }
  .lede { margin: 0; color: var(--mute); font-size: 17px; line-height: 1.55; max-width: 62ch; }
  .small { margin: 0; color: var(--mute); font-size: 13px; }
  .coins { margin: 0; font-family: var(--display); color: var(--gold); font-size: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .cards, .chars { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .tree { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; }
  .branch { display: flex; flex-direction: column; gap: 10px; min-width: 0; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }
  .btn {
    font-family: var(--display); font-size: 20px; padding: 10px 22px; border-radius: 10px;
    background: var(--gold); color: #2b2118; border: 0; box-shadow: 0 4px 0 #a7731d;
  }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #a7731d; }
  .field { width: 100%; max-width: 420px; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 2px solid var(--plank-edge); background: #1b130b; color: var(--cream); font: inherit; font-size: 16px; }
  textarea.field { max-width: 100%; font-size: 12px; }
  .testnodes { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 520px; text-align: left; }
  .testnode { display: flex; align-items: center; gap: 8px; }
  .testnode span { flex: 1; font-size: 14px; }
  .btn.mini { min-width: 44px; padding: 8px 12px; }
  .btn.ghost { background: transparent; color: var(--cream); border: 2px solid var(--plank-edge); box-shadow: none; }
  .card, .char, .node {
    display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0;
    background: #3a2c1f; border: 2px solid #5c4430; border-radius: 12px; padding: 14px 16px; line-height: 1.45;
  }
  .card:hover:not(:disabled), .char:hover:not(:disabled), .node:hover:not(:disabled) { border-color: var(--gold); }
  .card strong, .char strong, .node strong { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--cream); }
  .card span, .char span, .node span { font-size: 14px; color: var(--mute); }
  .tag { font-family: var(--display); color: var(--sky) !important; letter-spacing: 0.05em; font-size: 13px !important; }
  .price { color: var(--gold) !important; font-family: var(--display); font-size: 16px !important; margin-top: auto; }
  .char .weapon { color: var(--gold) !important; }
  .char .stats { font-variant-numeric: tabular-nums; }
  .char .rec { color: var(--sky) !important; }
  .char.locked:disabled { opacity: 1; border-style: dashed; background: rgba(0,0,0,0.22); }
  .char.locked > :not(.cond):not(.cond-progress) { opacity: 0.55; }
  .char .cond { color: var(--gold) !important; }
  .char .cond-progress { font-variant-numeric: tabular-nums; color: var(--cream) !important; }
  .notice { margin: 0; padding: 10px 14px; border: 2px solid var(--sky); border-radius: 10px; color: var(--cream); background: rgba(0,0,0,0.22); font-size: 15px; line-height: 1.5; }
  .ctabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .ctab {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; text-align: left;
    background: #3a2c1f; border: 2px solid #5c4430; border-radius: 10px; padding: 8px 12px;
  }
  .ctab strong { font-family: var(--display); font-weight: 400; font-size: 18px; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .ctab span { font-size: 13px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .ctab.on { border-color: var(--gold); background: #4a3826; }
  .ctab:hover:not(:disabled) { border-color: var(--gold); }
  .ctab .tbar { display: block; width: 100%; height: 5px; border-radius: 3px; margin-top: 4px; background: linear-gradient(to right, var(--gold) var(--p), rgba(0,0,0,0.4) var(--p)); }
  .branch.own h3 { color: var(--sky); }
  .branch.own .node { border-color: #4f6f78; }
  /* 영구 강화: 코인 줄은 스크롤해도 위에 붙어 있다 (아래쪽 노드를 살 때 남은 코인이 보이게) */
  .sticky-coins { position: sticky; top: 0; z-index: 2; background: var(--plank); padding-block: 10px; margin-block: -10px; box-shadow: 0 8px 10px -8px rgba(0,0,0,0.6); }
  .node.short:disabled { opacity: 0.8; }
  .node.short .price { color: var(--mute) !important; }
  .node.done:disabled { opacity: 0.7; border-color: var(--sky); }
  .unlock-new { margin: 0; font-family: var(--display); color: var(--sky); font-size: 22px; }

  #hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
    padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #hud .top { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; }
  #hud .goal { font-family: var(--display); font-size: clamp(20px, 3vw, 30px); text-shadow: 0 2px 0 #000; font-variant-numeric: tabular-nums; }
  #hud .gold { justify-self: end; font-family: var(--display); color: var(--gold); font-size: 20px; text-shadow: 0 2px 0 #000; }
  #hud .bottom { display: flex; flex-direction: column; gap: 6px; }
  .bar { position: relative; height: 18px; max-width: 360px; width: 100%; background: rgba(0,0,0,0.55); border: 2px solid rgba(244,239,225,0.35); border-radius: 9px; overflow: hidden; }
  #hud .bottom .bar { max-width: none; }
  .bar .fill { position: absolute; inset: 0 auto 0 0; }
  /* 블록으로: 줄 상자가 부모 글자 크기를 따라 커져 글자가 막대 아래로 밀려 잘리던 것 (폰에서 잘 보였다) */
  .bar .label { position: relative; display: block; padding-left: 8px; font-size: 12px; line-height: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; text-shadow: 0 1px 0 #000; }
  .weapons { display: flex; flex-wrap: wrap; gap: 6px; }
  .weapons .w { font-size: 12px; background: rgba(0,0,0,0.5); border-radius: 6px; padding: 2px 8px; }
  .weapons .whistle-cd { color: var(--sky); }
  .weapons .balls { display: inline-flex; align-items: center; gap: 6px; }
  .weapons .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); border: 2px solid var(--cream); display: inline-block; }
  .toggle { font-size: 16px !important; }
  #game { cursor: crosshair; }
  #hint {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    width: min(calc(100% - 32px), 640px); margin: 0; padding: 10px 16px; text-align: center; pointer-events: none;
    background: rgba(43,33,24,0.88); border: 2px solid var(--plank-edge); border-radius: 10px; font-size: 16px; line-height: 1.5;
  }
  #whistle {
    position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: max(calc(86px + env(safe-area-inset-bottom, 0px)), calc(var(--hud-bottom, 0px) + 12px));
    width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--plank-edge); background: rgba(43,33,24,0.8);
    font-family: var(--display); font-size: 16px; color: var(--cream);
  }
  #swap {
    position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); bottom: max(calc(170px + env(safe-area-inset-bottom, 0px)), calc(var(--hud-bottom, 0px) + 96px));
    width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--plank-edge); background: rgba(43,33,24,0.8);
    font-family: var(--display); font-size: 14px; color: var(--cream);
  }
  /* 터치 화면의 일시정지 (키보드가 없으면 Esc를 못 누른다) */
  #pausebtn {
    position: fixed; right: max(18px, env(safe-area-inset-right, 0px)); top: calc(64px + env(safe-area-inset-top, 0px));
    width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--plank-edge); background: rgba(43,33,24,0.8);
    font-size: 14px; color: var(--cream); letter-spacing: -2px;
  }
  @media (hover: hover) and (pointer: fine) { #whistle, #swap, #pausebtn { display: none; } }
  @media (prefers-reduced-motion: reduce) { .btn:active:not(:disabled) { transform: none; } }
</style>

<div id="stage"><canvas id="game" aria-label="팝 셰퍼드 게임 화면"></canvas></div>
<div id="hud" hidden></div>
<button id="whistle" type="button" hidden>휘슬</button>
<button id="swap" type="button" hidden>바꾸기</button>
<button id="pausebtn" type="button" aria-label="일시정지" hidden>❚❚</button>
<p id="hint" hidden></p>
<div id="overlay" hidden></div>
<!--BUNDLE-->
